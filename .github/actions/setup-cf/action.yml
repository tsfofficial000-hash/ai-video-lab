name: "Setup CineForge"
description: "Python with pip cache, ffmpeg+fonts, cineforge requirements"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements-cineforge.txt
    - name: Install stack
      shell: bash
      run: |
        set -e
        pip install --quiet -r requirements-cineforge.txt
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libgl1 libglib2.0-0
        ffmpeg -version | head -1
