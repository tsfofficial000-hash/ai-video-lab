name: "Setup CineForge"
description: "Python venv (cached), ffmpeg, OFL fonts + whisper caches — target <=45s warm"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements-cineforge.txt
    - uses: actions/cache@v4
      with:
        path: ~/cf-venv
        key: venv-cf-${{ runner.os }}-v3-${{ hashFiles('requirements-cineforge.txt') }}
    - uses: actions/cache@v4
      with:
        path: media/fonts
        key: fonts-v1
    - uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: whisper-models-v1
    - name: Venv (restore-or-build, with hang guard)
      shell: bash
      run: |
        ok=0
        if [ -x ~/cf-venv/bin/python ]; then
          if timeout 60 ~/cf-venv/bin/python -c "import librosa, faster_whisper, numpy, scenedetect" 2>/dev/null; then
            ok=1; echo "venv cache hit: $(~/cf-venv/bin/python -V)"
          else
            echo "venv cache stale - rebuilding"; rm -rf ~/cf-venv
          fi
        fi
        if [ "$ok" != "1" ]; then
          python -m venv ~/cf-venv
          ~/cf-venv/bin/pip install -q --upgrade pip
          for i in 1 2 3; do
            if timeout 360 ~/cf-venv/bin/pip install -q -r requirements-cineforge.txt; then ok=1; break; fi
            echo "pip attempt $i failed or hung - retrying"; sleep 5
          done
          [ "$ok" = "1" ] || { echo "pip install failed after 3 attempts"; exit 1; }
        fi
        echo "$HOME/cf-venv/bin" >> $GITHUB_PATH
    - name: "ffmpeg (capability-driven, drawtext required for titles)"
      shell: bash
      run: |
        has_drawtext() { ffmpeg -hide_banner -filters 2>/dev/null | grep -q "[ ]drawtext "; }
        install_btbn() {
          # BtbN GPL build (has freetype/drawtext/libass), GitHub-hosted = reliable
          curl -sSL --max-time 300 -o /tmp/ff.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            && sudo tar xJf /tmp/ff.tar.xz --strip-components=1 -C /usr/local/bin \
               --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' \
            && sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
        }
        if command -v ffmpeg >/dev/null 2>&1 && has_drawtext; then
          echo "ffmpeg preinstalled with drawtext: $(ffmpeg -version | head -1)"
        elif for i in 1 2 3; do
               timeout 300 sudo apt-get update -qq && \
               timeout 300 sudo apt-get install -y -qq ffmpeg && break || \
               { echo "apt attempt $i failed"; sleep 5; }
             done && command -v ffmpeg >/dev/null 2>&1 && has_drawtext; then
          echo "apt ffmpeg with drawtext: $(ffmpeg -version | head -1)"
        else
          echo "installing BtbN static ffmpeg (drawtext-capable)"
          install_btbn
          command -v ffmpeg >/dev/null 2>&1 && has_drawtext || { echo "no drawtext-capable ffmpeg"; exit 1; }
          ffmpeg -version | head -1
        fi
    - name: OFL fonts (cached, never fails the run)
      shell: bash
      run: |
        python3 scripts/cineforge/fetch_fonts.py --out media/fonts \
          --report reports/fonts_report.json || echo "fonts fallback: DejaVu"
