name: "03 - Audio Analysis"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cf
      - uses: actions/download-artifact@v4
        with: { name: stage-02-ingest }
      - run: |
          set -e
          cd scripts/cineforge && python3 audio_analysis.py --audio ../../media/audio.wav --reports ../../reports
          cd ../.. && cat reports/audio_analysis.json | head -20
      - uses: actions/upload-artifact@v4
        with: { name: stage-03-audio, path: reports/audio_analysis.json }
        retention-days: 3
