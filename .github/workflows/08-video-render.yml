name: "08 - Video Render"
on:
  workflow_dispatch:
    inputs:
      draft: { description: "draft render (540p-equivalent speed path)", required: false, default: "false" }
  workflow_call:
    inputs:
      draft: { type: string, default: "false" }

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cf
      - uses: actions/download-artifact@v4
        with: { name: stage-01-assets }
      - uses: actions/download-artifact@v4
        with: { name: stage-06-plan, path: plan }
      - uses: actions/download-artifact@v4
        with: { name: stage-07-mix, path: mix }
      - name: Dry-run gate (2-segment micro render)
        run: |
          set -e
          TL=$(python3 -c "import glob,os;print(os.path.abspath(glob.glob('plan/**/timeline.json',recursive=True)[0]))")
          SRC=$(python3 -c "import glob,os;print(os.path.abspath(glob.glob('source.mp4')[0]))")
          echo "timeline=$TL source=$SRC pwd=$(pwd)"
          ls -la "$(dirname "$TL")" || true
          cd scripts/cineforge && python3 render_ffmpeg.py --source "$SRC" \
            --timeline "$TL" --dryrun
      - name: Full render (segments -> xfade master -> mix mux)
        run: |
          set -e
          TL=$(python3 -c "import glob,os;print(os.path.abspath(glob.glob('plan/**/timeline.json',recursive=True)[0]))")
          PL=$(python3 -c "import glob,os;print(os.path.abspath(glob.glob('plan/**/edit_plan.json',recursive=True)[0]))")
          MX=$(python3 -c "import glob,os;print(os.path.abspath(glob.glob('mix/**/mixed_audio.wav',recursive=True)[0]) if glob.glob('mix/**/mixed_audio.wav',recursive=True) else '')")
          SRC=$(python3 -c "import glob,os;print(os.path.abspath(glob.glob('source.mp4')[0]))")
          echo "TL=$TL PL=$PL MX=$MX SRC=$SRC"
          cd scripts/cineforge && python3 render_ffmpeg.py --source "$SRC" \
            --timeline "$TL" --plan "$PL" \
            --mixed "$MX" --out "$GITHUB_WORKSPACE/out/master.mp4" \
            ${{ inputs.draft == 'true' && '--draft' || '' }}
          cd ../.. && ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/master.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: stage-08-render
          path: |
            out/master.mp4
            out/poster.jpg
            out/filtergraph.txt
            out/timeline.json
          retention-days: 3
