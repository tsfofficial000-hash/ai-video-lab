name: "09 - Captions & Grade"
on:
  workflow_dispatch:
    inputs:
      caption_style: { description: "empty = from plan", required: false, default: "" }
  workflow_call:
    inputs:
      caption_style: { type: string, default: "" }

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cf
      - uses: actions/download-artifact@v4
        with: { name: stage-08-render, path: render }
      - uses: actions/download-artifact@v4
        with: { name: stage-04-transcript, path: transcript }
      - uses: actions/download-artifact@v4
        with: { name: stage-06-plan, path: plan }
      - name: Generate + burn captions (libass), letterbox per plan
        run: |
          set -e
          CS=$(python3 -c "import json;p=json.load(open('plan/reports/edit_plan.json'));print(p.get('caption_style') or '')")
          MP=$(python3 -c "import glob;c=glob.glob('plan/**/edit_plan.json',recursive=True)+glob.glob('reports/edit_plan.json');print(c[0]);assert c")
          TR=$(python3 -c "import glob;c=glob.glob('transcript/**/transcript.json',recursive=True)+glob.glob('reports/transcript.json');print(c[0]);assert c")
          MV=$(python3 -c "import glob;c=glob.glob('render/**/master.mp4',recursive=True);print(c[0]);assert c")
          CS="${{ inputs.caption_style || '' }}"
          CS="${CS:-$(python3 -c "import json,sys;p=json.load(open(sys.argv[1]));print(p.get('caption_style') or '')" "$MP")}"
          mkdir -p out media
          if [ -n "$CS" ]; then
            cd scripts/cineforge
            python3 captions.py --transcript "../../$TR" \
              --plan "../../$MP" --style "$CS" --out ../media/captions.ass
            cd ../..
            ffmpeg -v error -y -i "$MV" -vf "ass=media/captions.ass" \
              -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -c:a copy \
              -movflags +faststart out/final.mp4
          else
            cp "$MV" out/final.mp4
          fi
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: stage-09-final
          path: |
            out/final.mp4
            out/poster.jpg
            media/captions.ass
          retention-days: 7
