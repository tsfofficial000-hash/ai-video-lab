name: "10 - Quality Control"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cf
      - uses: actions/download-artifact@v4
        with: { name: stage-09-final, path: final }
      - uses: actions/download-artifact@v4
        with: { name: stage-06-plan, path: plan }
      - uses: actions/download-artifact@v4
        with: { name: stage-07-mix, path: mix }
      - uses: actions/download-artifact@v4
        with: { name: stage-01-assets, path: assets01 }
      - name: QC gate + auto-repair
        run: |
          set -e
          FV=$(python3 -c "import glob;c=glob.glob('final/**/final.mp4',recursive=True);print(c[0]);assert c")
          PL=$(python3 -c "import glob;c=glob.glob('plan/**/edit_plan.json',recursive=True)+glob.glob('reports/edit_plan.json');print(c[0]);assert c")
          # captions_report.json rides in the stage-09 artifact; qc.py reads it
          # from repo-root reports/ (D6 pixel test cue source)
          CR=$(python3 -c "import glob;c=glob.glob('final/**/captions_report.json',recursive=True);print(c[0] if c else '')")
          [ -n "$CR" ] && cp "$CR" reports/captions_report.json || echo "WARN: captions_report.json not in stage-09 artifact"
          echo "final=$FV plan=$PL"
          ASS=$(python3 -c "import glob;c=glob.glob('final/**/captions.ass',recursive=True);print(c[0] if c else '')")
          FD=$(python3 -c "import os;d='media/fonts';print(d if os.path.isdir(d) and os.listdir(d) else '')")
          QCARGS=""
          [ -n "$ASS" ] && QCARGS="--ass ../../$ASS"
          [ -n "$FD" ] && QCARGS="$QCARGS --fontsdir ../../$FD"
          cd scripts/cineforge && python3 qc.py --video "../../$FV" \
            --plan "../../$PL" --reports ../../reports $QCARGS
      - name: Gate aggregation (G1-G10 with numbers)
        run: |
          set -e
          FV=$(python3 -c "import glob;c=glob.glob('final/**/final.mp4',recursive=True);print(c[0]);assert c")
          cd scripts/cineforge && python3 gates.py --video "../../$FV" \
            --reports ../../reports --search "../..:../../plan:../../mix:../../assets01:../../final" \
            --style "$(python3 -c "import json,glob;p=(glob.glob('../../plan/**/edit_plan.json',recursive=True) or ['../../reports/edit_plan.json'])[0];print(json.load(open(p)).get('style','beat_montage'))")"
          cd ../.. && python3 -c "import json;g=json.load(open('reports/gates_report.json'));red=[k for k,v in g.items() if k.startswith('G') and v.get('green') is False];print('verdict','GREEN pending '+str(g.get('PENDING')) if not red else 'RED');assert not red, 'gates RED at stage-10: '+str({k:g[k]['value'] for k in red})"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-10-qc
          path: |
            reports/qc_report.json
            reports/gates_report.json
            reports/captions_report.json
            final/**/final.mp4
          retention-days: 7
