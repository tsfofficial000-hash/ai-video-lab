name: "10 - Quality Control"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cf
      - uses: actions/download-artifact@v4
        with: { name: stage-09-final, path: final }
      - uses: actions/download-artifact@v4
        with: { name: stage-06-plan, path: plan }
      - name: QC gate + auto-repair
        run: |
          set -e
          FV=$(python3 -c "import glob;c=glob.glob('final/**/final.mp4',recursive=True);print(c[0]);assert c")
          PL=$(python3 -c "import glob;c=glob.glob('plan/**/edit_plan.json',recursive=True)+glob.glob('reports/edit_plan.json');print(c[0]);assert c")
          echo "final=$FV plan=$PL"
          cd scripts/cineforge && python3 qc.py --video "../../$FV" \
            --plan "../../$PL" --reports ../../reports
      - name: Gate aggregation (G1-G10 with numbers)
        run: |
          set -e
          cd scripts/cineforge && python3 gates.py --video ../../out/final.mp4 \
            --reports ../../reports --style "$(python3 -c "import json;print(json.load(open('../../reports/edit_plan.json')).get('style','beat_montage'))")" || true
          cd ../.. && cat reports/gates_report.json | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: stage-10-qc
          path: |
            reports/qc_report.json
            reports/gates_report.json
            final/out/final.mp4
          retention-days: 7
