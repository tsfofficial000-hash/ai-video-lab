name: "97 - Debug: audio mix graph matrix"
on:
  workflow_dispatch:

permissions: { contents: write }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cf
      - run: |
          ffmpeg -version | head -1
          mkdir -p /tmp/mx && cd /tmp/mx
          ffmpeg -v error -y -f lavfi -i "sine=frequency=300:duration=4" \
            -af "volume='if(lt(mod(t,1),0.5),1,0)':eval=frame" -ar 48000 -ac 2 voice.wav
          ffmpeg -v error -y -f lavfi -i "sine=frequency=110:duration=4" \
            -af volume=0.8 -ar 48000 -ac 2 music.mp3
          echo "=== variant A: anull + [voice] label (current) ==="
          ffmpeg -v error -y -i voice.wav -i music.mp3 -filter_complex \
            "[0:a]anull[voice];[1:a]volume=0.9[mmain];[mmain][voice]sidechaincompress=threshold=0.02:ratio=8:attack=20:release=300:makeup=1.0[ducked];[ducked][voice]amix=inputs=2:duration=first,volume=2.0,loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=in:d=0.6,volume=1.0[out]" \
            -map "[out]" -ar 48000 -ac 2 a.wav && echo "A PASS" || echo "A FAIL"
          echo "=== variant B: no anull, direct [0:a] key ==="
          ffmpeg -v error -y -i voice.wav -i music.mp3 -filter_complex \
            "[1:a]volume=0.9[bed];[bed][0:a]sidechaincompress=threshold=0.02:ratio=8:attack=20:release=300:makeup=1.0[duck];[duck][0:a]amix=inputs=2:duration=first,volume=2.0,loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=in:d=0.6,volume=1.0[out]" \
            -map "[out]" -ar 48000 -ac 2 b.wav && echo "B PASS" || echo "B FAIL"
          echo "=== variant C: A minus loudnorm ==="
          ffmpeg -v error -y -i voice.wav -i music.mp3 -filter_complex \
            "[0:a]anull[voice];[1:a]volume=0.9[mmain];[mmain][voice]sidechaincompress=threshold=0.02:ratio=8:attack=20:release=300:makeup=1.0[ducked];[ducked][voice]amix=inputs=2:duration=first,volume=2.0,afade=t=in:d=0.6,volume=1.0[out]" \
            -map "[out]" -ar 48000 -ac 2 c.wav && echo "C PASS" || echo "C FAIL"
          echo "=== variant D: A minus sidechaincompress (anull+voice preserved) ==="
          ffmpeg -v error -y -i voice.wav -i music.mp3 -filter_complex \
            "[0:a]anull[voice];[1:a]volume=0.9[mmain];[mmain]anull[ducked];[ducked][voice]amix=inputs=2:duration=first,volume=2.0,loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=in:d=0.6,volume=1.0[out]" \
            -map "[out]" -ar 48000 -ac 2 d.wav && echo "D PASS" || echo "D FAIL"
          echo "=== variant E: real Sintel source instead of sine ==="
          curl -sSL --max-time 120 -o src.mp4 "https://download.blender.org/durian/trailer/sintel_trailer-480p.mp4" || true
          if [ -s src.mp4 ]; then
            ffmpeg -v error -y -i src.mp4 -i music.mp3 -filter_complex \
              "[0:a]anull[voice];[1:a]volume=0.9[mmain];[mmain][voice]sidechaincompress=threshold=0.02:ratio=8:attack=20:release=300:makeup=1.0[ducked];[ducked][voice]amix=inputs=2:duration=first,volume=2.0,loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=in:d=0.6,volume=1.0[out]" \
              -map "[out]" -ar 48000 -ac 2 e.wav && echo "E PASS" || echo "E FAIL"
            ffprobe -v error -show_entries stream=codec_type -of csv=p=0 src.mp4
          fi

      - name: "Xfade chain probe (39-input hypothesis)"
        run: |
          cd /tmp/mx
          # render 5 segments from the sine/testsrc source with the cover_crop graph
          ffmpeg -v error -y -f lavfi -i "testsrc2=s=640x360:d=10:r=30" -f lavfi -i "sine=frequency=440:duration=10" -c:v libx264 -preset ultrafast -c:a aac -shortest src5.mp4
          for i in 0 1 2 3 4; do
            SS=$(python3 -c "print(1.0 + $i*1.5)")
            ffmpeg -v error -y -ss $SS -t 1.0 -i src5.mp4 -filter_complex "[0:v]null,fps=60,setpts=PTS/1.0,fps=30,scale=1138:640,crop=360:640:389:0,setsar=1,scale=360:640,format=yuv420p,trim=duration=1.0,setpts=PTS-STARTPTS[v];[0:a]atempo=1.0,atrim=duration=1.0,asetpts=PTS-STARTPTS[a]" -map "[v]" -map "[a]" -c:v libx264 -preset ultrafast -crf 20 -c:a aac -r 30 -vsync cfr seg_$i.mp4
          done
          python3 - <<'PY'
          import json
          segs = [{"i": i, "out_dur": 1.0, "transition_after": {"type": "fade", "dur": 0.05}} for i in range(5)]
          json.dump({"meta": {"out_w": 360, "out_h": 640, "out_fps": 30,
                              "title_main": "T", "title_sub": "S"},
                     "segments": segs}, open("tl5.json", "w"))
          PY
          python3 $GITHUB_WORKSPACE/scripts/montage/assemble.py --timeline tl5.json --segdir . --out master5.mp4
          echo "--- luminance of master5 at 5 points ---"
          for T in 0.3 2.0 3.5 4.5 5.5; do
            ffmpeg -hide_banner -ss $T -i master5.mp4 -frames:v 1 -vf signalstats,metadata=print:key=lavfi.signalstats.YAVG -f null - 2>&1 | grep -a YAVG | head -1 | sed "s/^/t=$T /"
          done
