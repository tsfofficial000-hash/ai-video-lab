name: "97 - Probe: verbatim graph repro + in-situ bisection"
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "informational"
        required: false
        default: ""

permissions: { contents: read }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cf
      - name: Reproduce stage-8 environment exactly
        run: |
          set -e
          mkdir -p segs txt
          F=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          for i in 0 1; do
            ffmpeg -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=1.5" \
              -f lavfi -i "sine=frequency=330:duration=1.5" \
              -c:v libx264 -preset ultrafast -crf 28 -c:a aac -shortest segs/real_00$i.mp4
          done
          echo "END CARD" > txt/end1.txt
          echo "sub" > txt/end2.txt
          python3 - <<'PY'
          import subprocess, os, shutil
          print("which ffmpeg:", shutil.which("ffmpeg"))
          print(subprocess.run(["ffmpeg","-version"],capture_output=True,text=True).stdout.splitlines()[0])
          # VERBATIM failing graph from run 37875877209 stage-8
          base = os.getcwd()
          tf1 = f"{base}/txt/end1.txt"
          tf2 = f"{base}/txt/end2.txt"
          F = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          dt1 = (f"drawtext=fontfile={F}:textfile={tf1}:fontsize=56:fontcolor=white:"
                 f"borderw=3:bordercolor=black@0.55:x=(w-text_w)/2:y=h*0.44:"
                 f"alpha='if(lt(t,-1.58),0,if(lt(t,-1.08),(t--1.58)/0.5,1))':enable='gte(t,-1.58)'")
          dt2 = (f"drawtext=fontfile={F}:textfile={tf2}:fontsize=28:fontcolor=white@0.85:"
                 f"borderw=2:bordercolor=black@0.5:x=(w-text_w)/2:y=h*0.44+56+24:"
                 f"alpha='if(lt(t,-1.38),0,if(lt(t,-0.88),(t--1.38)/0.5,1))':enable='gte(t,-1.38)'")
          vpre = "[0:v:0]settb=AVTB,scale=1080:1920,setsar=1,setpts=PTS-STARTPTS,fps=30,format=yuv420p[v0];[1:v:0]settb=AVTB,scale=1080:1920,setsar=1,setpts=PTS-STARTPTS,fps=30,format=yuv420p[v1]"
          xf = "[v0][v1]xfade=transition=fade:duration=0.180:offset=0.420[x1]"
          apre = "[0:a:0]atrim=duration=0.600,asetpts=PTS-STARTPTS[a0];[1:a:0]atrim=duration=0.600,asetpts=PTS-STARTPTS[a1]"
          af = "[a0][a1]acrossfade=d=0.180:c1=tri:c2=tri[xa1]"
          fades = "fade=t=in:st=0:d=0.45,fade=t=out:st=0.320:d=0.7"
          aout = "loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=out:st=0.120:d=0.9"
          variants = {
            "verbatim":        ";".join([vpre, xf, apre, af, f"[x1]{dt1},{dt2},{fades}[vout]", f"[xa1]{aout}[aout]"]),
            "no_drawtext":     ";".join([vpre, xf, apre, af, f"[x1]{fades}[vout]", f"[xa1]{aout}[aout]"]),
            "dt1_only":        ";".join([vpre, xf, apre, af, f"[x1]{dt1},{fades}[vout]", f"[xa1]{aout}[aout]"]),
            "dt2_only":        ";".join([vpre, xf, apre, af, f"[x1]{dt2},{fades}[vout]", f"[xa1]{aout}[aout]"]),
            "dt_rel_path":     ";".join([vpre, xf, apre, af, "[x1]" + dt1.replace(tf1, "txt/end1.txt") + f",{fades}[vout]", f"[xa1]{aout}[aout]"]),
            "dt_alpha_only":   ";".join([vpre, xf, apre, af, "[x1]" + dt1.split(":alpha")[0] + f",{fades}[vout]", f"[xa1]{aout}[aout]"]),
          }
          for name, g in variants.items():
            cmd = ["ffmpeg","-hide_banner","-loglevel","error","-y",
                   "-i","segs/real_0000.mp4","-i","segs/real_0001.mp4",
                   "-filter_complex", g, "-map","[vout]","-map","[aout]",
                   "-f","null","-"]
            p = subprocess.run(cmd, capture_output=True, text=True)
            tail = (p.stderr or "").strip().splitlines()[-1:] if p.stderr else []
            print(f"{name:14s} rc={p.returncode} {'| '+tail[0][:120] if tail and p.returncode else ''}")
            if p.returncode != 0:
                # bisect: which filter name is unknown?
                import re
                m = re.search(r"[Nn]o such filter: '([^']+)'", p.stderr or "")
                print("   unknown filter:", m.group(1) if m else "n/a")
          # also test -filter_complex_script form with the verbatim graph
          open("graph.txt","w").write(variants["verbatim"])
          p = subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y",
                              "-i","segs/real_0000.mp4","-i","segs/real_0001.mp4",
                              "-filter_complex_script","graph.txt","-map","[vout]","-map","[aout]","-f","null","-"],
                             capture_output=True, text=True)
          print("script-form rc:", p.returncode, (p.stderr or "")[-200:])
          PY
