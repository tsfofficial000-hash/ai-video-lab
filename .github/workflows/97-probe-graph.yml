name: "97 - Probe: filtergraph bisection on runner ffmpeg"
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "informational"
        required: false
        default: ""

permissions: { contents: read }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cf
      - name: ffmpeg identity
        run: |
          which ffmpeg
          ffmpeg -version | head -3
      - name: Build 2 real-style segments
        run: |
          set -e
          mkdir -p segs
          for i in 0 1; do
            ffmpeg -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=1.5" \
              -vf "settb=AVTB,scale=1080:1920,setsar=1,setpts=PTS-STARTPTS,fps=30,format=yuv420p" \
              -c:v libx264 -preset ultrafast -crf 28 \
              -f lavfi -i "sine=frequency=330:duration=1.5" -c:a aac -shortest segs/real_00$i.mp4 || true
          done
          ls -la segs/
      - name: Bisection matrix (each filter alone, then chains)
        run: |
          set -e
          F=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          mkdir -p txt && echo "END CARD" > txt/end1.txt && echo "sub" > txt/end2.txt

          dt="drawtext=fontfile=$F:textfile=txt/end1.txt:fontsize=56:fontcolor=white:borderw=3:bordercolor=black@0.55:x=(w-text_w)/2:y=h*0.44:alpha='if(lt(t,-1.58),0,if(lt(t,-1.08),(t--1.58)/0.5,1))':enable='gte(t,-1.58)'"
          dt_plain="drawtext=fontfile=$F:textfile=txt/end1.txt:fontsize=56"
          dt_esc="drawtext=fontfile=$F\\:textfile=txt/end1.txt\\:fontsize=56"

          declare -A GRAPHS
          GRAPHS[trivial]="null=out"
          GRAPHS[settb]="[0:v]settb=AVTB,setpts=PTS-STARTPTS[v]"
          GRAPHS[xfade]="[0:v]settb=AVTB,setpts=PTS-STARTPTS,fps=30[v0];[1:v]settb=AVTB,setpts=PTS-STARTPTS,fps=30[v1];[v0][v1]xfade=transition=fade:duration=0.18:offset=0.42[v]"
          GRAPHS[drawtext_plain]="[0:v]$dt_plain[v]"
          GRAPHS[drawtext_full]="[0:v]$dt[v]"
          GRAPHS[acrossfade]="[0:a]atrim=duration=0.6,asetpts=PTS-STARTPTS[a0];[1:a]atrim=duration=0.6,asetpts=PTS-STARTPTS[a1];[a0][a1]acrossfade=d=0.18[a]"
          GRAPHS[loudnorm]="[0:a]loudnorm=I=-16:TP=-1.5:LRA=11[a]"
          GRAPHS[full]="[0:v:0]settb=AVTB,scale=1080:1920,setsar=1,setpts=PTS-STARTPTS,fps=30,format=yuv420p[v0];[1:v:0]settb=AVTB,scale=1080:1920,setsar=1,setpts=PTS-STARTPTS,fps=30,format=yuv420p[v1];[v0][v1]xfade=transition=fade:duration=0.180:offset=0.420[x1];[0:a:0]atrim=duration=0.600,asetpts=PTS-STARTPTS[a0];[1:a:0]atrim=duration=0.600,asetpts=PTS-STARTPTS[a1];[a0][a1]acrossfade=d=0.180:c1=tri:c2=tri[xa1];[x1]fade=t=in:st=0:d=0.45,fade=t=out:st=0.320:d=0.7[vout];[xa1]loudnorm=I=-16:TP=-1.5:LRA=11,afade=t=out:st=0.120:d=0.9[aout]"

          for name in trivial settb xfade drawtext_plain drawtext_full acrossfade loudnorm full; do
            g="${GRAPHS[$name]}"
            echo "=== variant: $name ==="
            if [[ "$name" == acrossfade || "$name" == loudnorm ]]; then
              ffmpeg -hide_banner -loglevel error -y -i segs/real_0000.mp4 -i segs/real_0001.mp4 \
                -filter_complex "$g" -map "[a]" -f null - 2>&1 | tail -2
            else
              ffmpeg -hide_banner -loglevel error -y -i segs/real_0000.mp4 -i segs/real_0001.mp4 \
                -filter_complex "$g" -map "[v]" -f null - 2>&1 | tail -2
            fi
            echo "rc=$? ($name)"
          done
      - name: Echo test (does the shell mangle the graph?)
        run: |
          G='[0:v]settb=AVTB,setpts=PTS-STARTPTS[v]'
          echo "simple quoted graph passthrough: $G"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=320x240:rate=30:duration=0.5" \
            -filter_complex "[0:v]null[v]" -map "[v]" -f null - && echo "INLINE LAVFI OK rc=$?"
          echo '{"t":1}' > /tmp/x.json
          python3 - <<'PY'
          import subprocess
          # exact same argv construction as assemble.py
          cmd = ["ffmpeg","-hide_banner","-loglevel","error","-y",
                 "-f","lavfi","-i","testsrc2=size=320x240:rate=30:duration=0.5",
                 "-filter_complex","[0:v]settb=AVTB,setpts=PTS-STARTPTS[v]",
                 "-map","[v]","-f","null","-"]
          p = subprocess.run(cmd, capture_output=True, text=True)
          print("python-subprocess rc:", p.returncode, (p.stderr or "")[-300:])
          PY
