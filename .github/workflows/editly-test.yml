name: "C - Editly JSON Templating"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/editly-test.yml"
      - "scripts/editly_complex_test.sh"
      - "scripts/gen_editly_spec.py"
      - "scripts/build_master.sh"
      - "scripts/fetch_footage.sh"
      - "scripts/gen_subs.sh"
      - "scripts/make_srt.py"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  editly-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Runner system report
        run: |
          echo "CPU: $(nproc) vCPU | MEM: $(free -h | awk '/Mem/{print $2}') | node: $(node --version)"

      - name: Install native build deps (headless-gl full header set + canvas fallback insurance)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev libx11-dev libxext-dev libxi-dev libxrandr-dev \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev >/dev/null

      - name: Run Editly complex edit test
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/*.sh
          scripts/editly_complex_test.sh 2>&1 | tee editly_run.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editly-artifacts
          path: |
            work/final_editly.mp4
            work/final_editly_norm.mp4
            work/spec.json
            work/subs.srt
            work/metrics.txt
            work/editly_probe.json
            work/editly_run.log
            work/thumbnail_editly.jpg
          retention-days: 7
          if-no-files-found: warn

      - name: Commit run log + JSON spec to logs/ (persist beyond artifact retention)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p logs/editly
          cp -f work/spec.json "logs/editly/run-${GITHUB_RUN_ID}-spec.json" 2>/dev/null || true
          scripts/push_logs.sh editly editly_run.log
