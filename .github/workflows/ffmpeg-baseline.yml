name: "A - FFmpeg Baseline (complex filtergraph)"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ffmpeg-baseline.yml"
      - "scripts/ffmpeg_complex_test.sh"
      - "scripts/build_master.sh"
      - "scripts/fetch_footage.sh"
      - "scripts/gen_subs.sh"
      - "scripts/make_srt.py"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ffmpeg-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Runner system report
        run: |
          echo "CPU: $(nproc) vCPU | MEM: $(free -h | awk '/Mem/{print $2}') | DISK: $(df -h / | awk 'NR==2{print $4}')"
          ffmpeg -hide_banner -version | head -2
          ffprobe -hide_banner -version | head -1

      - name: Run FFmpeg complex edit test (trim + xfade + 9:16 + drawtext + loudnorm + whisper SRT burn-in + hwaccel probes)
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/*.sh
          scripts/ffmpeg_complex_test.sh 2>&1 | tee lab_run.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-artifacts
          path: |
            work/final_ffmpeg.mp4
            work/master.mp4
            work/subs.srt
            work/metrics.txt
            work/final_probe.json
            work/footage.json
            work/hwaccels.txt
            work/hw_*.err
            work/time_*.txt
            work/thumbnail_ffmpeg.jpg
            lab_run.log
          retention-days: 7
          if-no-files-found: warn

      - name: Commit run log to logs/ffmpeg (persist beyond artifact retention)
        if: always()
        shell: bash
        run: |
          mkdir -p logs/ffmpeg
          OUT="logs/ffmpeg/run-${GITHUB_RUN_ID}.md"
          {
            echo "# A · FFmpeg baseline — run ${GITHUB_RUN_ID} @ ${GITHUB_SHA::7}" 
            echo
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\` — Result: \`${{ job.status }}\`"
            echo
            echo "## [METRIC] lines"
            echo '```text'
            grep -hE '^\[(METRIC|LAB|WARN|FAIL|DONE|SRT-WRITTEN|SUBS|MASTER|FETCH|TIME-SHIM)' lab_run.log 2>/dev/null | sort -u || echo "(none captured)"
            echo '```'
            echo
            echo "## Raw log tail (last 60 lines)"
            echo '```text'
            tail -60 lab_run.log 2>/dev/null || echo "(missing)"
            echo '```'
          } > "$OUT"
          git config user.name "ai-video-lab-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT"
          git commit -m "logs(ffmpeg): run ${GITHUB_RUN_ID} — ${{ job.status }}" || { echo 'nothing to commit'; exit 0; }
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main >/dev/null 2>&1 && git push origin HEAD:main >/dev/null 2>&1; then ok=1; echo 'logs pushed'; break; fi
            echo "push attempt $i failed, retrying..."; sleep 8
          done
          [ "$ok" -eq 1 ] || echo '::warning::could not push logs after 5 attempts'
