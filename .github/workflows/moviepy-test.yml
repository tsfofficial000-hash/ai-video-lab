name: "B - MoviePy 2.x Programmatic Edit"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/moviepy-test.yml"
      - "scripts/moviepy_complex_test.py"
      - "scripts/build_master.sh"
      - "scripts/fetch_footage.sh"
      - "scripts/gen_subs.sh"
      - "scripts/make_srt.py"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  moviepy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner system report
        run: |
          echo "CPU: $(nproc) vCPU | MEM: $(free -h | awk '/Mem/{print $2}') | DISK: $(df -h / | awk 'NR==2{print $4}')"

      - name: Prepare shared fixture + Whisper SRT
        run: |
          chmod +x scripts/*.sh
          scripts/build_master.sh
          scripts/gen_subs.sh

      - name: Run MoviePy complex edit test
        shell: bash
        run: |
          set -o pipefail
          pip install -q "moviepy==2.1.2"
          python scripts/moviepy_complex_test.py 2>&1 | tee moviepy_run.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moviepy-artifacts
          path: |
            work/final_moviepy.mp4
            work/final_moviepy_norm.mp4
            work/subs.srt
            work/metrics.txt
            work/moviepy_run.log
            work/thumbnail_moviepy.jpg
          retention-days: 7
          if-no-files-found: warn

      - name: Commit run log to logs/moviepy (persist beyond artifact retention)
        if: always()
        shell: bash
        run: |
          mkdir -p logs/moviepy
          OUT="logs/moviepy/run-${GITHUB_RUN_ID}.md"
          {
            echo "# B · MoviePy 2.x — run ${GITHUB_RUN_ID} @ ${GITHUB_SHA::7}"
            echo
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\` — Result: \`${{ job.status }}\`"
            echo
            echo "## [METRIC] lines"
            echo '```text'
            cat work/metrics.txt 2>/dev/null | sort -u || echo "(none captured)"
            echo '```'
            echo
            echo "## Raw log tail (last 60 lines)"
            echo '```text'
            tail -60 moviepy_run.log 2>/dev/null || echo "(missing)"
            echo '```'
          } > "$OUT"
          git config user.name "ai-video-lab-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT"
          git commit -m "logs(moviepy): run ${GITHUB_RUN_ID} — ${{ job.status }}" || { echo 'nothing to commit'; exit 0; }
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main >/dev/null 2>&1 && git push origin HEAD:main >/dev/null 2>&1; then ok=1; echo 'logs pushed'; break; fi
            echo "push attempt $i failed, retrying..."; sleep 8
          done
          [ "$ok" -eq 1 ] || echo '::warning::could not push logs after 5 attempts'
