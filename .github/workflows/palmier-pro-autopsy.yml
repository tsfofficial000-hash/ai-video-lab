name: "E - Palmier Pro macOS Headless Autopsy"

# Repo is PUBLIC => hosted-runner minutes (incl. macOS) are free & unlimited.
# Dispatch-only for benchmark control; time-boxed to respect CI budget.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  palmier-autopsy:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: System report
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          echo "cores: $(sysctl -n hw.ncpu) | RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          xcodebuild -version
          swift --version

      - name: Static forensic analysis (no build)
        run: |
          chmod +x scripts/*.sh
          scripts/palmier_analyze.sh 2>&1 | tee palmier_static.log
        timeout-minutes: 6

      - name: Build + headless launch probe (time-boxed)
        continue-on-error: true
        run: |
          scripts/palmier_build_probe.sh 2>&1 | tee palmier_build.log
        timeout-minutes: 22

      - name: Append verdicts to step summary
        if: always()
        run: |
          echo "## Palmier Pro Autopsy Metrics" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat palmier_metrics.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no metrics captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Static report (tail)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 "$RUNNER_TEMP/palmier-pro/palmier_static_report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(missing)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palmier-autopsy-artifacts
          path: |
            palmier_static.log
            palmier_build.log
            palmier_metrics.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Commit autopsy logs to logs/ (persist beyond artifact retention)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p logs/palmier
          cp -f "$RUNNER_TEMP/palmier-pro/palmier_static_report.md" "logs/palmier/run-${GITHUB_RUN_ID}-static-report.md" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/palmier-pro/palmier_launch.log" "logs/palmier/run-${GITHUB_RUN_ID}-launch.log" 2>/dev/null || true
          cp -f palmier_metrics.txt "logs/palmier/run-${GITHUB_RUN_ID}-metrics.txt" 2>/dev/null || true
          scripts/push_logs.sh palmier palmier_static.log
